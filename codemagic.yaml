workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Install npm dependencies
        script: | 
          cd src && npm install
      - name: CocoaPods installation
        script: | 
          cd src && pod install
      - name: Building iOS Project
        script: | 
          cd src && xcodebuild -workspace "The Shortcut Method.xcodeproj/project.xcworkspace" -scheme "The Shortcut Method" -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - src/build/**/*.ipa
      - src/build/**/*.app
